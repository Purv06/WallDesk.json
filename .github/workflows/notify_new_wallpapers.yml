name: Notify New Wallpapers on Push

on:
  push:
    paths:
      - 'WallDesk'
      - 'WallDesk.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  notify-users:
    name: Broadcast FCM Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-auth requests

      - name: Run FCM Notification Broadcaster
        env:
          FIREBASE_PROJECT_ID: 'widewalls-472c6'
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python .github/scripts/notify_fcm.py
